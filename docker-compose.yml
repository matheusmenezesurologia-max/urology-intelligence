# ---------------------------------------------------------------------------
# Urology Intelligence — Full stack orchestration
# Services: app, postgres, qdrant, redis, prometheus, grafana
# ---------------------------------------------------------------------------

name: urology-intelligence

services:
  # ----------------------------------------------------------------------- #
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: urology-intelligence:latest
    container_name: ui_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-urology}:${POSTGRES_PASSWORD:-urology}@postgres:5432/${POSTGRES_DB:-urology}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"          # FastAPI (host 8010 -> container 8000): /health, /metrics, /rag/query, /run
    volumes:
      - ./storage:/app/storage
    networks: [ui_net]
    # Run migrations, then launch the API + APScheduler supervisor.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ----------------------------------------------------------------------- #
  postgres:
    image: postgres:16-alpine
    container_name: ui_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urology}
      POSTGRES_DB: ${POSTGRES_DB:-urology}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urology} -d ${POSTGRES_DB:-urology}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ui_net]

  # ----------------------------------------------------------------------- #
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ui_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"          # REST
      - "6334:6334"          # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    networks: [ui_net]

  # ----------------------------------------------------------------------- #
  redis:
    image: redis:7-alpine
    container_name: ui_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ui_net]

  # ----------------------------------------------------------------------- #
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ui_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on: [app]
    networks: [ui_net]

  # ----------------------------------------------------------------------- #
  grafana:
    image: grafana/grafana:11.3.1
    container_name: ui_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [ui_net]

networks:
  ui_net:
    driver: bridge

volumes:
  pgdata:
  qdrantdata:
  redisdata:
  promdata:
  grafanadata:

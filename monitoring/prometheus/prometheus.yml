# Prometheus scrape configuration for Urology Intelligence.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: urology-intelligence

scrape_configs:
  - job_name: urology-intelligence
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: app

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
